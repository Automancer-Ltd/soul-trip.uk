name: site-contract

# This workflow both GATES and PUBLISHES soul-trip.uk.
#
# It used to only gate. Publishing was GitHub's implicit legacy Pages build,
# which fires on a push to `main` independently of anything here — so a failed
# contract check published to the live client site anyway. Observed on
# 2026-08-22 06:09: the `site-contract` run failed and the
# `pages-build-deployment` for the same push succeeded and published.
#
# The deploy jobs below therefore sit in the SAME workflow as the check and
# depend on it. A cross-workflow `needs:` does not exist, and a `workflow_run`
# trigger fires on completion rather than on success, so putting them here is
# what actually makes the check a gate rather than an opinion.
#
# Pages source was switched from "Deploy from a branch" to "GitHub Actions" on
# 2026-08-27 to make this possible. Reverting that setting silently restores the
# ungated behaviour above. (Pages source re-checked: gh api
# repos/Automancer-Ltd/soul-trip.uk/pages --jq .build_type == "workflow".)
#
# Two jobs. `verify` is the whole check (`scripts/check`, the same command an
# agent runs locally) and, on a push to main, uploads the Pages artifact.
# `deploy` publishes it and then proves production serves this exact tree.
# Fewer jobs because every job bills a whole minute and starts its own runner.
#
# Last verified: 2026-10-22 on automancer-vps (./scripts/check)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # cancel-in-progress is true only for pull_request events; a push to `main`
  # must never cancel the previous run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: check unbounded outside calls
        uses: Automancer-Ltd/estate-checks@d5f9c888a1ea5580db9f7a9f380b059ffeaaddce # v1.2.1
        with:
          exclude-paths: "scripts/test-negative-controls.mjs"

      # Secret scan inside the gate: `verify` uploads the whole checkout to the
      # public site, so a committed credential must stop the deploy here.
      # Same steps as premier-mist-site-reporting's secret-scan.yml.
      - name: Install gitleaks
        timeout-minutes: 3
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --retry-all-errors \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # A config without [extend].useDefault loads fine and scans with no rules.
      - name: Assert the gitleaks config extends the built-in ruleset
        run: |
          grep -Eq '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' .gitleaks.toml \
            || { echo "::error file=.gitleaks.toml::[extend].useDefault is not true; the scan cannot fail."; exit 1; }

      # --log-opts=HEAD: scan this branch's full history, not refs/pull/* (ci-standards).
      - name: Scan repository history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts=HEAD .

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install typecheck and lint runner
        timeout-minutes: 3
        run: python3 -m pip install mypy==2.4.0

      # mypy, repo-meta verifier and unit tests, manifest, site contract, Sentry
      # SRI and privacy, production-verifier self-proof, negative controls.
      - name: Check
        run: ./scripts/check

      # Publish. Only from `main`, only on a push, and only after the check above.
      # The site is hand-written and served from the repository root, which is
      # exactly what the legacy branch build published. Uploading the root keeps
      # the public surface byte-identical to what is live today; narrowing it
      # would be a change to the site, smuggled in as a change to CI.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A half-finished deploy must never be cancelled by the next push.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fetches the live manifest, requires it byte-identical to this tree's,
      # then hashes every one of the served files against it.
      - name: Production serves this exact tree
        run: node scripts/verify-production.mjs --base https://soul-trip.uk/ --verbose
